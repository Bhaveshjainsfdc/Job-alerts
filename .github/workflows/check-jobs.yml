name: Check Amazon Warehouse Jobs

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by a few minutes
    # during busy periods - this is a GitHub limitation, not something we
    # can control. Edit the "*/10" below to change the interval
    # (e.g. "*/5" for every 5 minutes).
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you click "Run workflow" in the Actions tab to test on demand

permissions:
  contents: write # needed so the workflow can commit seen_jobs.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        run: playwright install --with-deps chromium

      - name: Check for new jobs
        env:
          # Set these as repo Secrets (Settings -> Secrets and variables ->
          # Actions) rather than editing config.json, so nothing sensitive
          # ends up committed to the repo. NTFY_TOPIC is the important one;
          # the TWILIO_* ones are optional and only needed if you set up
          # Twilio call/text later.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python check_jobs.py

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-diagnostics
          path: |
            debug_screenshot.png
            debug_page.html
          if-no-files-found: ignore

      - name: Persist seen-jobs state
        if: always()
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f seen_jobs.json ]; then
            git add seen_jobs.json
            git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
            git push
          else
            echo "seen_jobs.json wasn't created this run (the job check likely failed before reaching that point) - nothing to persist."
          fi
